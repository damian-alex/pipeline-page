on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    enviroment:
      name: github-pages
    steps: 
      -uses: actions/checkout@v4
      -uses: actions/upload-pages-artifact@v3
      with:
        path: .
      -uses: actions/deploy-pages@v4   